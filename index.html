<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>The Story of Humzhnation</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background-color: lightblue;
    }

    #game {
        width: 100vw;
        height: 100vh;
        position: relative;
        background-color: black;
    }

    /* The player is one div that shows one frame of the sprite sheet at a time */
    #Player {
        position: absolute;
        left: 100px;
        top: 100px;
        width: 5vw;
        aspect-ratio: 224 / 304;               /* one frame: 224 x 304 px */
        background-image: url("gnome_sheet_v2.png");
        background-size: 500% 300%;            /* sheet is 5 columns x 3 rows */
        background-repeat: no-repeat;
        background-position: 0% 0%;
        user-select: none;
    }

    .flipped { transform: scaleX(-1); }

    #Debug {
        position: absolute;
        left: 8px;
        top: 8px;
        color: white;
        font: 14px monospace;
        pointer-events: none;
    }

	    /* Pause / save menu */
    #Menu {
        position: absolute;
        inset: 0;
        display: none;                          /* shown with Esc */
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.7);
        z-index: 10;
    }
    #MenuBox{
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 240px;
        padding: 24px 32px;
        background: #1d1d2b;
        border: 3px solid #c9a15b;
        border-radius: 8px;
        color: white;
        font-family: monospace;
        text-align: center;
    }
 
    #MenuBox h2 { margin: 0 0 8px; }
 
    #MenuBox button {
        padding: 10px;
        font: 16px monospace;
        color: white;
        background: #34344d;
        border: 2px solid #c9a15b;
        border-radius: 4px;
        cursor: pointer;
    }
 
    #MenuBox button:hover:not(:disabled) { background: #4a4a6e; }
    #MenuBox button:disabled { opacity: 0.4; cursor: default; }
 
    #MenuStatus { min-height: 1.2em; margin: 4px 0 0; font-size: 14px; color: #c9a15b; }
 
    #Hint {
        position: absolute;
        right: 8px;
        top: 8px;
        color: white;
        opacity: 0.6;
        font: 14px monospace;
        pointer-events: none;
    }


</style>
</head>

<body>

<div id="game">
    <div id="Player"></div>
    <div id="Debug"></div>
    <audio id="bgMusic1" src="AmbientBackground1.mp3" loop></audio>
    <audio id="bgMusic2" src="DarkPartsMusic.mpe3" loop></audio>
    <div id="Hint">Esc = menu</div>
    <div id="Menu">
        <div id="MenuBox">
            <h2>Menu</h2>
            <button id="BtnResume">Resume</button>
            <button id="BtnSave">Save game</button>
            <button id="BtnLoad">Load game</button>
            <p id="MenuStatus"></p>
        </div>
</div>
</div>

<script>
    let game     = document.getElementById("game");
    let Player   = document.getElementById("Player");
    let DebugBox = document.getElementById("Debug");

    // ---------- Sprite sheet ----------
    const SheetCols = 5;
    const SheetRows = 3;

    // Frame numbers count left to right, top to bottom (0 to 14)
    //   row 1: 0  1  2  3  4
    //   row 2: 5  6  7  8  9
    //   row 3: 10 11 12 13 14
    const IdleFrame    = 0;                   // standing still
    const WalkFrames   = [1, 2, 3, 4, 5];     // walk cycle
    const CrouchFrame  = 6;                   // right before leaving the ground
    const RiseFrames   = [7, 8];              // going up (first half, second half)
    const FallFrames   = [11, 12, 13, 14];    // the tumble poses
    const SpinStart    = 0.6;                 // fraction of the drop spent stepping through the poses once;
                                              // after that they loop until landing

    const AnimDelay = 6;          // game frames per animation frame (bigger = slower)
    const CrouchLength = 5;       // game frames spent crouching before a ground jump

    const ShowDebug = true;       // shows the current frame number top-left (press D to toggle)

    let AnimTimer = 0;
    let AnimIndex = 0;
    let CrouchTimer = 0;          // counts down while crouching
    let FallStartY = 0;           // where the fall began (the top of the jump)
    let LandingY;
    let Spinning = false;         // true once the fall has reached the looping spin
    let StateName = "idle";       // only used by the debug text

    function ShowFrame(frame)
    {
        let col = frame % SheetCols;
        let row = Math.floor(frame / SheetCols);
        let xPercent = col * 100 / (SheetCols - 1);
        let yPercent = row * 100 / (SheetRows - 1);
        Player.style.backgroundPosition = xPercent + "% " + yPercent + "%";
    }

    // Steps through a list of frames at the animation speed and returns the current one
    function Animate(list)
    {
        AnimTimer++;
        if (AnimTimer >= AnimDelay)
        {
            AnimTimer = 0;
            AnimIndex = (AnimIndex + 1) % list.length;
        }
        return list[AnimIndex % list.length];
    }

    // Picks which frame to show based on what the player is doing
    function ChooseFrame()
    {
        // 1. Crouching just before a jump
        if (CrouchTimer > 0) { StateName = "crouch"; return CrouchFrame; }

        // 2. In the air
        if (!PlayerOnGround)
        {
            if (PlayerJump)
            {
                // Going up: first half of the rise uses one frame, second half the other
                StateName = "rising";
                let risen = StartY - PlayerY;
                return (risen < JumpHeight / 2) ? RiseFrames[0] : RiseFrames[1];
            }

            // Coming down. Progress is how far down he has dropped (0 at the top, 1 at the ground).
            let total = OriginalY - FallStartY;
            let progress = (total > 0) ? (PlayerY - FallStartY) / total : 1;

            // First part: step through all the tumble poses once, ending on the last one
            if (progress < SpinStart)
            {
                StateName = "tumble steps";
                Spinning = false;
                let index = Math.floor(progress / SpinStart * FallFrames.length);
                return FallFrames[Math.min(index, FallFrames.length - 1)];
            }

            // Rest of the drop: keep cycling through the poses, continuing from the last one
            if (!Spinning)
            {
                Spinning = true;
                AnimIndex = FallFrames.length - 1;
                AnimTimer = 0;
            }
            StateName = "spinning";
            return Animate(FallFrames);
        }

        // 3. On the ground
        if (PlayerMove) { StateName = "walking"; return Animate(WalkFrames); }

        StateName = "idle";
        AnimIndex = 0;
        AnimTimer = 0;
        return IdleFrame;
    }

    // ---------- Player state ----------
    let PlayerX = 0;
    let PlayerY = window.innerHeight / 2;
    const OriginalY = PlayerY;
    let StartY = PlayerY;        // where the current jump began

    let speed = 4;
    let JumpSpeed = 5;
    let JumpHeight = window.innerHeight / 6;
    let FallSpeed = 2;

    let PlayerJump = false;      // true while rising
    let PlayerOnGround = true;
    let JumpsUsed = 0;
    const MaxJumps = 2;          // 2 = double jump
    let JumpRequested = false;   // set by a fresh space press, used up by the next frame
    let PlayerMove = false;      // true while an arrow key is moving the character

    let LeftPlayer = false;      // true = facing left

    let keys = {};

    document.addEventListener("keydown", function(event) {
        keys[event.key.toLowerCase()] = true;

	if (event.key === "Escape") { if (Paused) CloseMenu(); else OpenMenu(); }

        if (event.key.toLowerCase() === "d") DebugBox.style.display = (DebugBox.style.display === "none") ? "block" : "none";

        // A fresh press (not key repeat) asks for one jump
        if (event.key === " " && !event.repeat) JumpRequested = true;

        if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(event.key.toLowerCase())) {
            event.preventDefault();
        }
    });

    document.addEventListener("keyup", function(event) {
        keys[event.key.toLowerCase()] = false;
    });

    function StartJump()
    {
        PlayerJump = true;
        JumpsUsed++;
        StartY = PlayerY;
        AnimIndex = 0;       // so the fall tumble starts from its first frame
        AnimTimer = 0;
    }

    function MovePlayer()
    {
	if (Paused)
    	{
        requestAnimationFrame(MovePlayer);
        return;
    	}
        // Ground check
        PlayerOnGround = (PlayerY >= OriginalY);
        if (PlayerOnGround && !PlayerJump) JumpsUsed = 0;

        // Horizontal movement and facing direction
        PlayerMove = false;

        if (keys["arrowleft"])
        {
            LeftPlayer = true;
            PlayerMove = true;
            PlayerX -= speed;
        }

        if (keys["arrowright"])
        {
            LeftPlayer = false;
            PlayerMove = true;
            PlayerX += speed;
        }

        // Jumping: crouch first when on the ground, jump straight away in the air
        if (CrouchTimer > 0)
        {
            CrouchTimer--;
            if (CrouchTimer === 0) StartJump();
        }
        else if (JumpRequested && JumpsUsed < MaxJumps)
        {
            if (PlayerOnGround) CrouchTimer = CrouchLength;
            else StartJump();
        }
        JumpRequested = false;

        // Rising or falling
        if (PlayerJump)
        {
            Jump();
        }
        else if (PlayerY < OriginalY)
        {
            Gravity();
        }

        if (PlayerY > OriginalY) PlayerY = OriginalY;

        // Walking off the edge of the screen goes to the neighbouring room
        let maxX = game.clientWidth - Player.offsetWidth;
        if (PlayerX > maxX && CurrentRoom.exits.right) ChangeRoom(CurrentRoom.exits.right, "left");
        else if (PlayerX < 0 && CurrentRoom.exits.left) ChangeRoom(CurrentRoom.exits.left, "right");

        // Keep the player inside the game area
        PlayerX = Math.max(0, Math.min(PlayerX, game.clientWidth - Player.offsetWidth));
        PlayerY = Math.max(0, Math.min(PlayerY, game.clientHeight - Player.offsetHeight));

        // Update the ground state after moving, so the frame matches this frame's position
        PlayerOnGround = (PlayerY >= OriginalY);

        // Copy the JS numbers onto the element
        Player.style.left = PlayerX + "px";
        Player.style.top = PlayerY + "px";
        Player.classList.toggle("flipped", LeftPlayer);

        // Pick the sprite frame
        let frame = ChooseFrame();
        ShowFrame(frame);

        if (ShowDebug) DebugBox.textContent = "frame " + frame + "  (" + StateName + ")  room: " + CurrentRoom.name;

        requestAnimationFrame(MovePlayer);
    }

    function Jump()
    {
        if (StartY - PlayerY < JumpHeight)
        {
            PlayerY -= JumpSpeed;
        }
        else
        {
            PlayerJump = false;
            FallStartY = PlayerY;
        }
    }

    function Gravity()
    {
        PlayerY += FallSpeed;
    }

    // ---------- Background music ----------
    // Browsers only allow sound after the first key press or click
    let bgMusic = document.getElementById("bgMusic1");
    bgMusic.volume = 0.4;   // 0 to 1

    let MusicOn = false;    // becomes true after the first key press or click

    function StartMusic()
    {
        MusicOn = true;
        bgMusic.play();
        document.removeEventListener("keydown", StartMusic);
        document.removeEventListener("click", StartMusic);
    }

    document.addEventListener("keydown", StartMusic);
    document.addEventListener("click", StartMusic);

    // ---------- Rooms ----------
    // Each room is one screen. "exits" says which room you reach by walking off the left or right edge.
    // To add a room: add an entry here and point an exit of a neighbouring room at it.
    const Rooms = {
        start: {
            name: "Start",
            background: "black",
            music: "AmbientBackground1.mp3",
            exits: { right: "room2" }
        },
        room2: {
            name: "Room 2",
            background: "linear-gradient(#1b1030, #3a1d5c)",
            music: "DarkPartsMusic.mp3",      // change this file name to give the room its own music
            exits: { left: "start" }
        }
    };

    let CurrentRoomName = "start";
    let CurrentRoom = Rooms.start;

    // side: "left" or "right" = which edge of the new room the player appears at (leave out to keep the position)
    function ChangeRoom(roomName, side)
    {
        if (!Rooms[roomName]) roomName = "start";

        CurrentRoomName = roomName;
        CurrentRoom = Rooms[roomName];
        Save.room = roomName;                     // so the room is part of the save

        game.style.background = CurrentRoom.background;

        // Only switch the track if it is actually a different file, so shared music doesn't restart
        if (CurrentRoom.music && bgMusic.getAttribute("src") !== CurrentRoom.music)
        {
            bgMusic.src = CurrentRoom.music;
            if (MusicOn) bgMusic.play().catch(function() {});
        }

        if (side === "left")  PlayerX = 0;
        if (side === "right") PlayerX = game.clientWidth - Player.offsetWidth;
    }

	    // ---------- Save data and menu ----------
    // Everything that counts as progress lives in this one object.
    // Add new things here (items, defeated bosses, switches) and they are saved automatically.
    const SaveKey = "gnomeGameSave";
 
    let Save = {
        version: 1,
        room: "start",         // later: the room the player is in
        x: 0,                  // horizontal position as a fraction of the screen width (0 to 1)
        health: 3,
        bossesDefeated: [],    // e.g. ["boss1"]
        flags: {}              // e.g. { doorOpened: true }
    };
 
    let Paused = false;
 
    let Menu       = document.getElementById("Menu");
    let MenuStatus = document.getElementById("MenuStatus");
    let BtnResume  = document.getElementById("BtnResume");
    let BtnSave    = document.getElementById("BtnSave");
    let BtnLoad    = document.getElementById("BtnLoad");
 
    function HasSave()
    {
        try { return localStorage.getItem(SaveKey) !== null; }
        catch (e) { return false; }     // storage can be blocked (private windows, strict settings)
    }
 
    function OpenMenu()
    {
        Paused = true;
        MenuStatus.textContent = "";
        BtnLoad.disabled = !HasSave();
        Menu.style.display = "flex";
    }
 
    function CloseMenu()
    {
        Paused = false;
        JumpRequested = false;          // a space press made while paused must not cause a jump
        Menu.style.display = "none";
    }
 
    // Copy the current game into the save object, then store it in the browser
    function SaveGame()
    {
        Save.x = PlayerX / game.clientWidth;
 
        try
        {
            localStorage.setItem(SaveKey, JSON.stringify(Save));
            MenuStatus.textContent = "Game saved.";
            BtnLoad.disabled = false;
        }
        catch (e)
        {
            MenuStatus.textContent = "Could not save: browser storage is blocked.";
        }
    }
 
    // Put a loaded save back into the game
    function ApplySave()
    {
        let x = Number.isFinite(Save.x) ? Math.min(Math.max(Save.x, 0), 1) : 0;
 
        PlayerX = x * game.clientWidth;
        PlayerY = OriginalY;            // always put him back on the ground
 
        // Reset anything momentary
        PlayerJump = false;
        JumpsUsed = 0;
        CrouchTimer = 0;
        JumpRequested = false;
        Spinning = false;
 
        ChangeRoom(Save.room);
    }
 
    function LoadGame()
    {
        let text = null;
        try { text = localStorage.getItem(SaveKey); } catch (e) {}
 
        if (text === null)
        {
            MenuStatus.textContent = "No saved game found.";
            return;
        }
 
        try
        {
            Object.assign(Save, JSON.parse(text));
        }
        catch (e)
        {
            MenuStatus.textContent = "The save is damaged.";
            return;
        }
 
        ApplySave();
        CloseMenu();
    }
 
    // blur() takes the focus off the button, so pressing space later can't "click" it again
    BtnResume.addEventListener("click", function() { CloseMenu(); this.blur(); });
    BtnSave.addEventListener("click",   function() { SaveGame();  this.blur(); });
    BtnLoad.addEventListener("click",   function() { LoadGame();  this.blur(); });
 
    // If a save exists, start with the menu open so it can be loaded
    if (HasSave())
    {
        OpenMenu();
        MenuStatus.textContent = "Saved game found. Press Load to continue.";
    }
 
    ChangeRoom("start");
    MovePlayer();

</script>

</body>
</html>
