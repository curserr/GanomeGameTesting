<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>The Story of Humzhnation</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background-color: black;
    }

    /* The game fills the whole window. The canvas (game world) and the interface layer sit on top of each other. */
    #screen {
        position: fixed;
        inset: 0;
    }

    canvas {
        display: block;
        background: black;
    }

    /* Everything that is interface (text, menus, dialogue, bars) is plain HTML and CSS in this layer */
    #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;             /* clicks go through, except on things that turn it back on */
        font-family: monospace;
        color: white;
    }

    #Debug {
        position: absolute;
        left: 8px;
        top: 8px;
        font-size: 14px;
    }

    #Hint {
        position: absolute;
        right: 8px;
        top: 8px;
        font-size: 14px;
        opacity: 0.6;
    }

    /* Pause / save menu */
    #Menu {
        position: absolute;
        inset: 0;
        display: none;                    /* shown with Esc */
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.7);
        pointer-events: auto;
    }

    #MenuBox {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 240px;
        padding: 24px 32px;
        background: #1d1d2b;
        border: 3px solid #c9a15b;
        border-radius: 8px;
        text-align: center;
    }

    #MenuBox h2 { margin: 0 0 8px; }

    #MenuBox button {
        padding: 10px;
        font: 16px monospace;
        color: white;
        background: #34344d;
        border: 2px solid #c9a15b;
        border-radius: 4px;
        cursor: pointer;
    }

    #MenuBox button.selected { background: #4a4a6e; }
    #MenuBox button:disabled { opacity: 0.4; cursor: default; }

    #MenuStatus { min-height: 1.2em; margin: 4px 0 0; font-size: 14px; color: #c9a15b; }
</style>
</head>

<body>

<div id="screen">
    <canvas id="game"></canvas>

    <div id="ui">
        <div id="Debug"></div>
        <div id="Hint">Esc = menu</div>

        <div id="Menu">
            <div id="MenuBox">
                <h2>Menu</h2>
                <button id="BtnResume">Resume</button>
                <button id="BtnSave">Save game</button>
                <button id="BtnLoad">Load game</button>
                <p id="MenuStatus"></p>
            </div>
        </div>
    </div>
</div>

<audio id="bgMusic1" src="AmbientBackground1.mp3" loop></audio>

<script>
    // ---------- Canvas ----------
    // Only the game world is drawn on the canvas: backgrounds, terrain, the player, enemies, NPCs.
    // Anything that is interface (menus, dialogue, health bars, text) is HTML and CSS in the #ui layer.
    //
    // The canvas always fills the whole window. W and H are its size in pixels and are updated on resize.
    let WindowWidth = window.innerWidth;
    let WindowHeight = window.innerHeight;

    let canvas = document.getElementById("game");
    let ctx = canvas.getContext("2d");

    // Sizes the canvas to the window. On sharp (high-DPI) screens the canvas gets more real pixels,
    // so the picture stays crisp, but everything is still measured in normal window pixels (W x H).
    function SizeCanvas()
    {
        WindowWidth = window.innerWidth;
        WindowHeight = window.innerHeight;

        let dpr = window.devicePixelRatio || 1;
        canvas.width  = Math.round(WindowWidth * dpr);
        canvas.height = Math.round(WindowHeight * dpr);
        canvas.style.width  = WindowWidth + "px";
        canvas.style.height = WindowHeight + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
    }
    SizeCanvas();

    // ---------- Sprite sheet ----------
    const PlayerSheetCols = 5;
    const PlayerSheetRows = 3;
    //const TerrainSheetCols;
    //const TerrainSheetRows;
    const PlayerFrameWidth = 224;                       // one frame of the sheet, in sheet pixels
    const PlayerFrameHeight = 304;
    const SmallPlatformWidth = 317;
    const SmallPlatformHeight = 155;                    
    const Medium1PlatformWidth = 616;   // 1 is always the slightly bigger version
    const Medium1PlatformHeight = 167;
    const Medium2PlatformWidth = 523;
    const Medium2PlatformHeight = 169;
    const Big1PlatformWidth = 1031;       // 1 is always the slightly bigger version
    const Big1PlatformHeight = 183;
    const Big2PlatformWidth = 722;
    const Big2PlatformHeight = 204;
    const LargePlatformWidth = 1255;
    const LargePlatformHeight = 207;
    

    let SheetImgPlayer = new Image();
    let SheetImgDarkPlatforms = new Image();
    SheetImgPlayer.src = "gnome_sheet_v2.png";
    SheetImgDarkPlatforms = "Platforms.png";
    let PlayerWidth = WindowWidth * 0.05;                   // the player is 5% of the window width wide
    let PlayerHeight = PlayerWidth * PlayerFrameHeight / PlayerFrameWidth;  // the height follows the shape of one frame

    // Frame numbers count left to right, top to bottom (0 to 14)
    //   row 1: 0  1  2  3  4
    //   row 2: 5  6  7  8  9
    //   row 3: 10 11 12 13 14
    const IdleFrame    = 0;                   // standing still
    const WalkFrames   = [1, 2, 3, 4, 5];     // walk cycle
    const CrouchFrame  = 6;                   // right before leaving the ground
    const RiseFrames   = [7, 8];              // going up (first half, second half)
    const FallFrames   = [11, 12, 13, 14];    // the tumble poses
    const SpinStart    = 0.6;                 // fraction of the drop spent stepping through the poses once;
                                              // after that they loop until landing

    // As spread sheet the purple/black platforms
      const PlatformTypes = {
    STONE: "stone",
    WOOD: "wood",
    CORRUPTED: "corrupted"
};


    const AnimDelay = 6;          // game frames per animation frame (bigger = slower)
    const CrouchLength = 5;       // game frames spent crouching before a ground jump

    let ShowDebug = true;         // shows the current frame number top-left (press D to toggle)

    let AnimTimer = 0;
    let AnimIndex = 0;
    let CrouchTimer = 0;          // counts down while crouching
    let FallStartY = 0;           // where the fall began (the top of the jump)
    let LandingY;
    let Spinning = false;         // true once the fall has reached the looping spin
    let StateName = "idle";       // only used by the debug text
    let CurrentPlayerFrame = 0;         // the Player sprite frame that gets drawn
  

    // Steps through a list of frames at the animation speed and returns the current one
    function Animate(list)
    {
        AnimTimer++;
        if (AnimTimer >= AnimDelay)
        {
            AnimTimer = 0;
            AnimIndex = (AnimIndex + 1) % list.length;
        }
        return list[AnimIndex % list.length];
    }

    

    // Picks which frame to show based on what the player is doing
    function ChooseFrame()
    {
        // 1. Crouching just before a jump
        if (CrouchTimer > 0) { StateName = "crouch"; return CrouchFrame; }

        // 2. In the air
        if (!PlayerOnGround)
        {
            if (PlayerJump)
            {
                // Going up: first half of the rise uses one frame, second half the other
                StateName = "rising";
                let risen = StartY - PlayerY;
                return (risen < JumpHeight / 2) ? RiseFrames[0] : RiseFrames[1];
            }

            // Coming down. Progress is how far down he has dropped (0 at the top, 1 at the ground).
            let total = OriginalY - FallStartY;
            let progress = (total > 0) ? (PlayerY - FallStartY) / total : 1;

            // First part: step through all the tumble poses once, ending on the last one
            if (progress < SpinStart)
            {
                StateName = "tumble steps";
                Spinning = false;
                let index = Math.floor(progress / SpinStart * FallFrames.length);
                return FallFrames[Math.min(index, FallFrames.length - 1)];
            }

            // Rest of the drop: keep cycling through the poses, continuing from the last one
            if (!Spinning)
            {
                Spinning = true;
                AnimIndex = FallFrames.length - 1;
                AnimTimer = 0;
            }
            StateName = "spinning";
            return Animate(FallFrames);
        }

        // 3. On the ground
        if (PlayerMove) { StateName = "walking"; return Animate(WalkFrames); }

        StateName = "idle";
        AnimIndex = 0;
        AnimTimer = 0;
        return IdleFrame;
    }

    // ---------- Player state ----------
    let PlayerX = 0;
    let PlayerY = WindowHeight / 1.2;
    let OriginalY = PlayerY;                 // the ground level
    let StartY = PlayerY;        // where the current jump began

    let speed = 4;
    let JumpSpeed = 5;
    let JumpHeight = WindowHeight / 6;
    let FallSpeed = 2;

    let PlayerJump = false;      // true while rising
    let PlayerOnGround = true;
    let JumpsUsed = 0;
    const MaxJumps = 2;          // 2 = double jump
    let JumpRequested = false;   // set by a fresh space press, used up by the next frame
    let PlayerMove = false;      // true while an arrow key is moving the character

    let LeftPlayer = false;      // true = facing left

    let keys = {};

    document.addEventListener("keydown", function(event) {
        let key = event.key.toLowerCase();
        let wasPaused = Paused;          // remember, because the key may close the menu

        keys[key] = true;

        if (event.key === "Escape") { if (Paused) CloseMenu(); else OpenMenu(); }
        else if (Paused) MenuKey(event);

        if (key === "d") ShowDebug = !ShowDebug;

        // A fresh press (not key repeat) asks for one jump, but never while the menu is open
        if (event.key === " " && !event.repeat && !wasPaused) JumpRequested = true;

        if (["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "enter"].includes(key)) {
            event.preventDefault();
        }
    });

    document.addEventListener("keyup", function(event) {
        keys[event.key.toLowerCase()] = false;
    });

    function StartJump()
    {
        PlayerJump = true;
        JumpsUsed++;
        StartY = PlayerY;
        AnimIndex = 0;       // so the fall tumble starts from its first frame
        AnimTimer = 0;
    }

    // Game logic for one frame: no drawing happens here
    function MovePlayer()
    {
        // Ground check
        PlayerOnGround = (PlayerY >= OriginalY);
        if (PlayerOnGround && !PlayerJump) JumpsUsed = 0;

        // Horizontal movement and facing direction
        PlayerMove = false;

        if (keys["arrowleft"])
        {
            LeftPlayer = true;
            PlayerMove = true;
            PlayerX -= speed;
        }

        if (keys["arrowright"])
        {
            LeftPlayer = false;
            PlayerMove = true;
            PlayerX += speed;
        }

        // Jumping: crouch first when on the ground, jump straight away in the air
        if (CrouchTimer > 0)
        {
            CrouchTimer--;
            if (CrouchTimer === 0) StartJump();
        }
        else if (JumpRequested && JumpsUsed < MaxJumps)
        {
            if (PlayerOnGround) CrouchTimer = CrouchLength;
            else StartJump();
        }
        JumpRequested = false;

        // Rising or falling
        if (PlayerJump)
        {
            Jump();
        }
        else if (PlayerY < OriginalY)
        {
            Gravity();
        }

        if (PlayerY > OriginalY) PlayerY = OriginalY;

        // Walking off the edge of the screen goes to the neighbouring room
        let maxX = WindowWidth - PlayerWidth;
        if (PlayerX > maxX && CurrentRoom.exits.right) ChangeRoom(CurrentRoom.exits.right, "left");
        else if (PlayerX < 0 && CurrentRoom.exits.left) ChangeRoom(CurrentRoom.exits.left, "right");

        // Keep the player inside the game area
        PlayerX = Math.max(0, Math.min(PlayerX, WindowWidth - PlayerWidth));
        PlayerY = Math.max(0, Math.min(PlayerY, WindowHeight - PlayerHeight));

        // Update the ground state after moving, so the frame matches this frame's position
        PlayerOnGround = (PlayerY >= OriginalY);

        // Pick the sprite frame (Draw() will use it)
        CurrentPlayerFrame = ChooseFrame();
    }

    function Jump()
    {
        if (StartY - PlayerY < JumpHeight)
        {
            PlayerY -= JumpSpeed;
        }
        else
        {
            PlayerJump = false;
            FallStartY = PlayerY;
        }
    }

    function Gravity()
    {
        PlayerY += FallSpeed;
    }

    // ---------- Background music ----------
    // Browsers only allow sound after the first key press or click
    let bgMusic = document.getElementById("bgMusic1");
    bgMusic.volume = 0.4;   // default volume

    let MusicOn = false;    // becomes true after the first key press or click

    function StartMusic()
    {
        MusicOn = true;
        bgMusic.play();
        document.removeEventListener("keydown", StartMusic);
        document.removeEventListener("click", StartMusic);
    }

    document.addEventListener("keydown", StartMusic);
    document.addEventListener("click", StartMusic);

    // ---------- Rooms ----------
    // Each room is one screen. "exits" says which room you reach by walking off the left or right edge.
    // "background" is one colour, or two colours (top, bottom) for a gradient.
    // To add a room: add an entry here and point an exit of a neighbouring room at it.
    const Rooms = {
    start: {
        name: "Start",
        background: "lightgreen",
        music: "AmbientBackground1.mp3",
        exits: { right: "room2" }
        platforms:
        [
          {x: WindowWidth / 6 ,y: WindowHeight/5, width}
        ]
    },

    room2: {
        name: "Room 2",
        background: "black",
        volume: 0.7,
        music: "DarkPartsMusic.mp3",
        exits: { left: "start", right: "room3" }
    },

    room3: {
        name: "Room 3",
        background: "black",
        volume: 0.7,
        music: "DarkPartsMusic.mp3",
        exits: { left: "room2" }
    }
      };

    let CurrentRoomName = "start";
    let CurrentRoom = Rooms.start;
    let BackgroundFill = "black";             // what Draw() paints behind everything

    function MakeBackground(colors)
    {
      if (typeof colors === "string") return colors;

        if (colors.length === 1) return colors[0];

        let gradient = ctx.createLinearGradient(0, 0, 0, WindowHeight);
        gradient.addColorStop(0, colors[0]);
        gradient.addColorStop(1, colors[1]);
        return gradient;
    }

    // side: "left" or "right" = which edge of the new room the player appears at (leave out to keep the position)
    function ChangeRoom(roomName, side)
    {
        if (!Rooms[roomName]) roomName = "start";

        CurrentRoomName = roomName;
        CurrentRoom = Rooms[roomName];
        bgMusic.volume = CurrentRoom.volume ?? 0.4;
        Save.room = roomName;                     // so the room is part of the save

        BackgroundFill = MakeBackground(CurrentRoom.background);

        // Only switch the track if it is actually a different file, so shared music doesn't restart
        if (CurrentRoom.music && bgMusic.getAttribute("src") !== CurrentRoom.music)
        {
            bgMusic.src = CurrentRoom.music;
            if (MusicOn) bgMusic.play().catch(function() {});
        }

        if (side === "left")  PlayerX = 0;
        if (side === "right") PlayerX = WindowWidth - PlayerWidth;
    }

    // When the window changes size, resize the canvas and move everything so it keeps its place on screen
    window.addEventListener("resize", function() {

    // Store the old dimensions and player position BEFORE resizing
    let oldW = WindowWidth;
    let oldH = WindowHeight;
    let oldPlayerX = PlayerX;

    let wasOnGround = PlayerOnGround;

    // Resize canvas and update WindowWidth / WindowHeight
    SizeCanvas();

    // Preserve the player's relative horizontal position
    let relativeX = oldPlayerX / oldW;
    PlayerX = relativeX * WindowWidth;

    // Update player dimensions
    PlayerWidth = WindowWidth * 0.05;
    PlayerHeight = PlayerWidth * PlayerFrameHeight / PlayerFrameWidth;

    // Update ground position
    OriginalY = WindowHeight / 1.2;

    if (wasOnGround) {
        PlayerY = OriginalY;
    } else {
        PlayerY *= WindowHeight / oldH;
    }

    StartY *= WindowHeight / oldH;
    FallStartY *= WindowHeight / oldH;

    JumpHeight = WindowHeight / 6;

    // Keep player inside the screen
    PlayerX = Math.max(0, Math.min(PlayerX, WindowWidth - PlayerWidth));

    BackgroundFill = MakeBackground(CurrentRoom.background);

    console.log("Old X:", oldPlayerX);
    console.log("New X:", PlayerX);
    console.log("Old width:", oldW);
    console.log("New width:", WindowWidth);
});

    // ---------- Save data ----------
    // Everything that counts as progress lives in this one object.
    // Add new things here (items, defeated bosses, switches) and they are saved automatically.
    const SaveKey = "gnomeGameSave";

    let Save = {
        version: 1,
        room: "start",         // the room the player is in
        x: 0,                  // horizontal position as a fraction of the screen width (0 to 1)
        health: 3,
        bossesDefeated: [],    // e.g. ["boss1"]
        flags: {}              // e.g. { doorOpened: true }
    };

    function HasSave()
    {
        try { return localStorage.getItem(SaveKey) !== null; }
        catch (e) { return false; }     // storage can be blocked (private windows, strict settings)
    }

    // Copy the current game into the save object, then store it in the browser
    function SaveGame()
    {
        Save.x = PlayerX / WindowWidth;

        try
        {
            localStorage.setItem(SaveKey, JSON.stringify(Save));
            SetMenuStatus("Game saved.");
            MenuHasSave = true;
            RefreshMenu();
        }
        catch (e)
        {
            SetMenuStatus("Could not save: browser storage is blocked.");
        }
    }

    // Put a loaded save back into the game
    function ApplySave()
    {
        let x = Number.isFinite(Save.x) ? Math.min(Math.max(Save.x, 0), 1) : 0;

        PlayerX = x * WindowWidth;
        PlayerY = OriginalY;            // always put him back on the ground

        // Reset anything momentary
        PlayerJump = false;
        JumpsUsed = 0;
        CrouchTimer = 0;
        JumpRequested = false;
        Spinning = false;

        ChangeRoom(Save.room);
    }

    function LoadGame()
    {
        let text = null;
        try { text = localStorage.getItem(SaveKey); } catch (e) {}

        if (text === null)
        {
            SetMenuStatus("No saved game found.");
            return;
        }

        try
        {
            Object.assign(Save, JSON.parse(text));
        }
        catch (e)
        {
            SetMenuStatus("The save is damaged.");
            return;
        }

        ApplySave();
        CloseMenu();
    }

    // ---------- Menu (HTML and CSS, in the #ui layer) ----------
    const MenuItems = ["Resume", "Save game", "Load game"];

    let DebugBox    = document.getElementById("Debug");
    let Menu        = document.getElementById("Menu");
    let MenuStatus  = document.getElementById("MenuStatus");
    let MenuButtons = [document.getElementById("BtnResume"), document.getElementById("BtnSave"), document.getElementById("BtnLoad")];

    let Paused = false;
    let MenuSelected = 0;                 // which button is highlighted
    let MenuHasSave = false;

    function MenuEnabled(index)
    {
        return (index === 2) ? MenuHasSave : true;     // "Load game" needs a save
    }

    function SetMenuStatus(text)
    {
        MenuStatus.textContent = text;
    }

    // Greys out buttons that can't be used and highlights the selected one
    function RefreshMenu()
    {
        for (let i = 0; i < MenuButtons.length; i++)
        {
            MenuButtons[i].disabled = !MenuEnabled(i);
            MenuButtons[i].classList.toggle("selected", i === MenuSelected && MenuEnabled(i));
        }
    }

    function OpenMenu()
    {
        Paused = true;
        SetMenuStatus("");
        MenuHasSave = HasSave();
        MenuSelected = 0;
        Menu.style.display = "flex";
        RefreshMenu();
    }

    function CloseMenu()
    {
        Paused = false;
        JumpRequested = false;          // a space press made while paused must not cause a jump
        Menu.style.display = "none";
    }

    function MenuActivate(index)
    {
        if (index === 0) CloseMenu();
        else if (index === 1) SaveGame();
        else if (index === 2) LoadGame();
    }

    // Moves the highlight up or down, skipping buttons that are greyed out
    function MenuMove(step)
    {
        let i = MenuSelected;
        for (let n = 0; n < MenuItems.length; n++)
        {
            i = (i + step + MenuItems.length) % MenuItems.length;
            if (MenuEnabled(i)) { MenuSelected = i; break; }
        }
        RefreshMenu();
    }

    function MenuKey(event)
    {
        if (event.key === "ArrowDown") MenuMove(1);
        else if (event.key === "ArrowUp") MenuMove(-1);
        else if ((event.key === "Enter" || event.key === " ") && !event.repeat) MenuActivate(MenuSelected);
    }

    // blur() takes the focus off the button, so pressing space later can't "click" it again
    MenuButtons.forEach(function(button, index) {
        button.addEventListener("click", function() { MenuActivate(index); this.blur(); });
        button.addEventListener("mouseenter", function() {
            if (MenuEnabled(index)) { MenuSelected = index; RefreshMenu(); }
        });
    });

    // ---------- Drawing the game world (canvas) ----------
    function DrawPlayer()
    {
        if (!SheetImgPlayer.complete || SheetImgPlayer.naturalWidth === 0) return;     // sheet not loaded yet

        let col = CurrentPlayerFrame % PlayerSheetCols;
        let row = Math.floor(CurrentPlayerFrame / PlayerSheetCols);

        ctx.save();
        if (LeftPlayer)
        {
            ctx.translate(Math.round(PlayerX) + PlayerWidth, Math.round(PlayerY));
            ctx.scale(-1, 1);                    // mirror to face left
        }
        else
        {
            ctx.translate(Math.round(PlayerX), Math.round(PlayerY));
        }
        ctx.drawImage(SheetImgPlayer, col * PlayerFrameWidth, row * PlayerFrameHeight, PlayerFrameWidth, PlayerFrameHeight, 0, 0, PlayerWidth, PlayerHeight);
        ctx.restore();
    }
    
    function DrawPlatforms()
    {
      if(!SheetImgDarkPlatforms.complete || SheetImgDarkPlatforms.naturalWidth === 0 ) return;

      let col = 


    }



    // Everything in the game world is drawn through here, back to front.
    // Later things (terrain, enemies, NPCs) get their own Draw function called in this list.
    function Draw()
    {
        ctx.fillStyle = BackgroundFill;
        ctx.fillRect(0, 0, WindowWidth, WindowHeight);

        // terrain, enemies and NPCs will go here

        DrawPlayer();
        DrawPlatforms();
    }

    // ---------- Updating the interface (HTML) ----------
    function UpdateUI()
    {
        DebugBox.style.display = ShowDebug ? "block" : "none";
        if (ShowDebug) DebugBox.textContent = "frame " + CurrentPlayerFrame + "  (" + StateName + ")  room: " + CurrentRoom.name;
    }

    // ---------- Main loop ----------
    function GameLoop()
    {
        if (!Paused) MovePlayer();      // the game freezes while the menu is open
        Draw();
        UpdateUI();
        requestAnimationFrame(GameLoop);
    }

    // If a save exists, start with the menu open so it can be loaded
    if (HasSave())
    {
        OpenMenu();
        MenuSelected = 2;               // highlight "Load game"
        RefreshMenu();
        SetMenuStatus("Saved game found. Press Load to continue.");
    }

    ChangeRoom("start");
    GameLoop();
</script>

</body>
</html>
