<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Camera demo</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background-color: black;
    }

    /* The game fills the whole window. The canvas (game world) and the interface layer sit on top of each other. */
    #screen {
        position: fixed;
        inset: 0;
    }

    canvas {
        display: block;
        background: black;
    }

    /* Everything that is interface (text, menus, dialogue, bars) is plain HTML and CSS in this layer.
       The camera never moves it. */
    #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-family: monospace;
        color: white;
    }

    #Debug {
        position: absolute;
        left: 8px;
        top: 8px;
        font-size: 14px;
        line-height: 1.4;
        white-space: pre;
        text-shadow: 0 0 4px black;
    }

    #Hint {
        position: absolute;
        right: 8px;
        top: 8px;
        font-size: 14px;
        opacity: 0.7;
        text-align: right;
        text-shadow: 0 0 4px black;
    }

    /* Small map of the room: the gold box is what the camera currently shows */
    #Mini {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        width: min(60vw, 520px);
        text-align: center;
        font-size: 12px;
        text-shadow: 0 0 4px black;
    }

    #MiniBar {
        position: relative;
        height: 10px;
        margin-top: 4px;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.5);
    }

    #MiniView {
        position: absolute;
        top: 0;
        bottom: 0;
        background: rgba(201, 161, 91, 0.6);
    }

    #MiniPlayer {
        position: absolute;
        top: -3px;
        width: 4px;
        height: 16px;
        background: white;
    }

    /* Pause / save menu */
    #Menu {
        position: absolute;
        inset: 0;
        display: none;                    /* shown with Esc */
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.7);
        pointer-events: auto;
    }

    #MenuBox {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 240px;
        padding: 24px 32px;
        background: #1d1d2b;
        border: 3px solid #c9a15b;
        border-radius: 8px;
        text-align: center;
    }

    #MenuBox h2 { margin: 0 0 8px; }

    #MenuBox button {
        padding: 10px;
        font: 16px monospace;
        color: white;
        background: #34344d;
        border: 2px solid #c9a15b;
        border-radius: 4px;
        cursor: pointer;
    }

    #MenuBox button.selected { background: #4a4a6e; }
    #MenuBox button:disabled { opacity: 0.4; cursor: default; }

    #MenuStatus { min-height: 1.2em; margin: 4px 0 0; font-size: 14px; color: #c9a15b; }
</style>
</head>

<body>

<div id="screen">
    <canvas id="game"></canvas>

    <div id="ui">
        <div id="Debug"></div>
        <div id="Hint">&larr; &rarr; move &nbsp; Space jump (twice = double jump)<br>Esc menu &nbsp; D debug text</div>

        <div id="Mini">
            <div id="MiniLabel"></div>
            <div id="MiniBar"><div id="MiniView"></div><div id="MiniPlayer"></div></div>
        </div>

        <div id="Menu">
            <div id="MenuBox">
                <h2>Menu</h2>
                <button id="BtnResume">Resume</button>
                <button id="BtnSave">Save game</button>
                <button id="BtnLoad">Load game</button>
                <p id="MenuStatus"></p>
            </div>
        </div>
    </div>
</div>

<script>
    // =====================================================================
    //  CAMERA DEMO
    //  Everything in the world has a position in "units" measured from the left edge of its room.
    //  The camera is just two numbers (CameraX, CameraY): how far the view has moved.
    //  A fixed room is simply a room that is not wider than the screen, so the camera has nowhere to go.
    // =====================================================================

    // ---------- Canvas and units ----------
    // The world is measured in design units: the screen is always DesignH units tall.
    // Scale turns units into real pixels. A wider window just shows more units sideways.
    const DesignH = 720;

    let WindowWidth, WindowHeight, dpr, Scale;
    let ViewW;                                // how many units wide the screen currently shows

    let canvas = document.getElementById("game");
    let ctx = canvas.getContext("2d");

    function SizeCanvas()
    {
        WindowWidth  = window.innerWidth;
        WindowHeight = window.innerHeight;
        dpr   = window.devicePixelRatio || 1;
        Scale = WindowHeight / DesignH;
        ViewW = WindowWidth / Scale;

        canvas.width  = Math.round(WindowWidth * dpr);
        canvas.height = Math.round(WindowHeight * dpr);
        canvas.style.width  = WindowWidth + "px";
        canvas.style.height = WindowHeight + "px";

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
    }
    SizeCanvas();

    // Drawing in screen pixels (backgrounds that fill the window)
    function UseScreenSpace()
    {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // Drawing in world units. f is the parallax factor: 1 = moves with the world,
    // smaller = moves slower, so it looks further away.
    function UseWorldSpace(f)
    {
        let s = dpr * Scale;
        ctx.setTransform(s, 0, 0, s, Math.round(-CameraX * f * s), Math.round(-CameraY * f * s));
    }

    // ---------- Small helper: a random number generator that gives the same numbers every time ----------
    function Rand(seed)
    {
        return function() {
            seed |= 0; seed = seed + 0x6D2B79F5 | 0;
            let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
            t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
    }

    // ---------- Sprite sheet ----------
    const SheetCols = 5;
    const SheetRows = 3;
    const FrameW = 224;                       // one frame of the sheet, in sheet pixels
    const FrameH = 304;

    let SheetImg = new Image();
    SheetImg.src = "gnome_sheet_v2.png";

    const PlayerW = 64;                       // size of the player in units
    const PlayerH = PlayerW * FrameH / FrameW;

    // Frame numbers count left to right, top to bottom (0 to 14)
    //   row 1: 0  1  2  3  4
    //   row 2: 5  6  7  8  9
    //   row 3: 10 11 12 13 14
    const IdleFrame    = 0;                   // standing still
    const WalkFrames   = [1, 2, 3, 4, 5];     // walk cycle
    const CrouchFrame  = 6;                   // right before leaving the ground
    const RiseFrames   = [7, 8];              // going up (first half, second half)
    const FallFrames   = [11, 12, 13, 14];    // the tumble poses
    const SpinStart    = 0.6;                 // fraction of the drop spent stepping through the poses once;
                                              // after that they loop until landing

    const AnimDelay = 6;          // game steps per animation frame (bigger = slower)
    const CrouchLength = 5;       // game steps spent crouching before a ground jump

    let ShowDebug = true;         // press D to toggle

    let AnimTimer = 0;
    let AnimIndex = 0;
    let CrouchTimer = 0;          // counts down while crouching
    let FallStartY = 0;           // where the fall began (the top of the jump)
    let Spinning = false;         // true once the fall has reached the looping spin
    let StateName = "idle";       // only used by the debug text
    let CurrentFrame = 0;         // the sprite frame that gets drawn

    // Steps through a list of frames at the animation speed and returns the current one
    function Animate(list)
    {
        AnimTimer++;
        if (AnimTimer >= AnimDelay)
        {
            AnimTimer = 0;
            AnimIndex = (AnimIndex + 1) % list.length;
        }
        return list[AnimIndex % list.length];
    }

    // Picks which frame to show based on what the player is doing
    function ChooseFrame()
    {
        // 1. Crouching just before a jump
        if (CrouchTimer > 0) { StateName = "crouch"; return CrouchFrame; }

        // 2. In the air
        if (!PlayerOnGround)
        {
            if (PlayerJump)
            {
                // Going up: first half of the rise uses one frame, second half the other
                StateName = "rising";
                let risen = StartY - PlayerY;
                return (risen < JumpHeight / 2) ? RiseFrames[0] : RiseFrames[1];
            }

            // Coming down. Progress is how far down he has dropped (0 at the top, 1 at the ground).
            let total = OriginalY - FallStartY;
            let progress = (total > 0) ? (PlayerY - FallStartY) / total : 1;

            // First part: step through all the tumble poses once, ending on the last one
            if (progress < SpinStart)
            {
                StateName = "tumble steps";
                Spinning = false;
                let index = Math.floor(progress / SpinStart * FallFrames.length);
                return FallFrames[Math.min(index, FallFrames.length - 1)];
            }

            // Rest of the drop: keep cycling through the poses, continuing from the last one
            if (!Spinning)
            {
                Spinning = true;
                AnimIndex = FallFrames.length - 1;
                AnimTimer = 0;
            }
            StateName = "spinning";
            return Animate(FallFrames);
        }

        // 3. On the ground
        if (PlayerMove) { StateName = "walking"; return Animate(WalkFrames); }

        StateName = "idle";
        AnimIndex = 0;
        AnimTimer = 0;
        return IdleFrame;
    }

    // ---------- Player state (all in world units) ----------
    const OriginalY = 600;                    // ground level: the top of the player when he stands on the floor
    const FloorY = OriginalY + PlayerH;       // the line his feet are on

    let PlayerX = 200;                        // position inside the CURRENT ROOM, from its left edge
    let PlayerY = OriginalY;
    let StartY = PlayerY;                     // where the current jump began

    let speed = 4;                            // units per game step
    let JumpSpeed = 7;
    let JumpHeight = 120;
    let FallSpeed = 4;

    let PlayerJump = false;      // true while rising
    let PlayerOnGround = true;
    let JumpsUsed = 0;
    const MaxJumps = 2;          // 2 = double jump
    let JumpRequested = false;   // set by a fresh space press, used up by the next step
    let PlayerMove = false;      // true while an arrow key is moving the character

    let LeftPlayer = false;      // true = facing left

    let keys = {};

    document.addEventListener("keydown", function(event) {
        let key = event.key.toLowerCase();
        let wasPaused = Paused;          // remember, because the key may close the menu

        keys[key] = true;

        if (event.key === "Escape") { if (Paused) CloseMenu(); else OpenMenu(); }
        else if (Paused) MenuKey(event);

        if (key === "d") ShowDebug = !ShowDebug;

        // A fresh press (not key repeat) asks for one jump, but never while the menu is open
        if (event.key === " " && !event.repeat && !wasPaused) JumpRequested = true;

        if (["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "enter"].includes(key)) {
            event.preventDefault();
        }
    });

    document.addEventListener("keyup", function(event) {
        keys[event.key.toLowerCase()] = false;
    });

    function StartJump()
    {
        PlayerJump = true;
        JumpsUsed++;
        StartY = PlayerY;
        AnimIndex = 0;       // so the fall tumble starts from its first frame
        AnimTimer = 0;
    }

    // ---------- Rooms ----------
    // width / height are in units. 1280 x 720 is exactly one screen on a 16:9 window.
    // A room that is wider than the screen scrolls. A room that is not wider stays fixed
    // (and is centred if the window is wider than the room).
    // "exits" says which room you reach by walking off the left or right edge of the room.
    const Emojis   = ["🌲", "🏠", "⛺", "🪨", "🍄", "🌵", "🗿", "🏺", "🔥", "🌳"];
    const Floaters = ["⭐", "🦋", "☁️", "🎈", "🪁", "🐦"];

    // Fills a room with reference objects so you can see the camera move.
    // Emojis stand on the floor, floaters hang in the air, and a gold pillar marks every 1280 units.
    function BuildProps(width, seed)
    {
        let r = Rand(seed);
        let list = [];

        for (let x = 160; x < width - 100; x += 170 + r() * 160)
        {
            list.push({ e: Emojis[Math.floor(r() * Emojis.length)], x: x, s: 50 + Math.floor(r() * 40) });
        }

        for (let x = 300; x < width - 100; x += 300 + r() * 300)
        {
            list.push({ e: Floaters[Math.floor(r() * Floaters.length)], x: x, up: 220 + Math.floor(r() * 260), s: 48 });
        }

        for (let k = 1; k * 1280 < width; k++)
        {
            list.push({ box: true, x: k * 1280 - 20, w: 40, h: 260, color: "#c9a15b", label: String(k) });
        }

        return list;
    }

    const Rooms = {
        hall: {
            name: "Hall (fixed room, 1 screen)",
            width: 1280,
            background: ["#1b1030", "#3a1d5c"],
            exits: { right: "cave" },
            props: BuildProps(1280, 11)
        },
        cave: {
            name: "Cave (scrolling, 3 screens)",
            width: 1280 * 3,
            background: ["#0d2330", "#1f5666"],
            exits: { left: "hall", right: "road" },
            props: BuildProps(1280 * 3, 22)
        },
        road: {
            name: "Long road (scrolling, 6 screens)",
            width: 1280 * 6,
            background: ["#2b1a0e", "#7a4a22"],
            exits: { left: "cave" },
            props: BuildProps(1280 * 6, 33)
        }
    };

    let CurrentRoomName = "hall";
    let CurrentRoom = Rooms.hall;
    let BackgroundFill = "black";

    function RoomHeight()
    {
        return CurrentRoom.height || DesignH;
    }

    // The background is painted in screen space, so it depends on the window height
    function MakeBackground(colors)
    {
        if (typeof colors === "string") return colors;
        if (colors.length === 1) return colors[0];

        let gradient = ctx.createLinearGradient(0, 0, 0, WindowHeight);
        gradient.addColorStop(0, colors[0]);
        gradient.addColorStop(1, colors[1]);
        return gradient;
    }

    // side: "left" or "right" = which edge of the new room the player appears at (leave out to keep the position)
    function ChangeRoom(roomName, side)
    {
        if (!Rooms[roomName]) roomName = "hall";

        CurrentRoomName = roomName;
        CurrentRoom = Rooms[roomName];
        Save.room = roomName;                     // so the room is part of the save

        BackgroundFill = MakeBackground(CurrentRoom.background);

        if (side === "left")  PlayerX = 0;
        if (side === "right") PlayerX = CurrentRoom.width - PlayerW;

        UpdateCamera(false);                       // jump straight to the right view, don't glide in
    }

    // ---------- Camera ----------
    let CameraX = 0;                              // the left edge of the view, in room units
    let CameraY = 0;                              // the top edge of the view
    const CameraSmooth = 0.12;                    // 1 = stiff, smaller = softer follow

    // Where the camera wants to be: the player in the middle, but never showing beyond the room
    function CameraTarget()
    {
        let rw = CurrentRoom.width;
        let rh = RoomHeight();

        let tx = PlayerX + PlayerW / 2 - ViewW / 2;
        let ty = PlayerY + PlayerH / 2 - DesignH / 2;

        if (rw <= ViewW) tx = (rw - ViewW) / 2;               // room fits on screen: centre it
        else tx = Math.max(0, Math.min(tx, rw - ViewW));      // otherwise stay inside the room

        if (rh <= DesignH) ty = 0;
        else ty = Math.max(0, Math.min(ty, rh - DesignH));

        return { x: tx, y: ty };
    }

    function UpdateCamera(snap)
    {
        let t = CameraTarget();

        if (snap)
        {
            CameraX = t.x;
            CameraY = t.y;
        }
        else
        {
            CameraX += (t.x - CameraX) * CameraSmooth;
            CameraY += (t.y - CameraY) * CameraSmooth;
        }
    }

    // When the window changes size, only the canvas and the camera need updating.
    // Every position in the game is in units, so nothing else has to move.
    window.addEventListener("resize", function() {
        SizeCanvas();
        BackgroundFill = MakeBackground(CurrentRoom.background);
        UpdateCamera(true);
    });

    // ---------- Game logic: one step ----------
    // No drawing happens here. Steps run at a fixed 60 per second (see GameLoop),
    // so the game feels the same on a 60 Hz and a 144 Hz screen.
    function MovePlayer()
    {
        // Ground check
        PlayerOnGround = (PlayerY >= OriginalY);
        if (PlayerOnGround && !PlayerJump) JumpsUsed = 0;

        // Horizontal movement and facing direction
        PlayerMove = false;

        if (keys["arrowleft"])
        {
            LeftPlayer = true;
            PlayerMove = true;
            PlayerX -= speed;
        }

        if (keys["arrowright"])
        {
            LeftPlayer = false;
            PlayerMove = true;
            PlayerX += speed;
        }

        // Jumping: crouch first when on the ground, jump straight away in the air
        if (CrouchTimer > 0)
        {
            CrouchTimer--;
            if (CrouchTimer === 0) StartJump();
        }
        else if (JumpRequested && JumpsUsed < MaxJumps)
        {
            if (PlayerOnGround) CrouchTimer = CrouchLength;
            else StartJump();
        }
        JumpRequested = false;

        // Rising or falling
        if (PlayerJump)
        {
            Jump();
        }
        else if (PlayerY < OriginalY)
        {
            Gravity();
        }

        if (PlayerY > OriginalY) PlayerY = OriginalY;

        // Walking off the edge of the ROOM goes to the neighbouring room
        let maxX = CurrentRoom.width - PlayerW;
        if (PlayerX > maxX && CurrentRoom.exits.right) ChangeRoom(CurrentRoom.exits.right, "left");
        else if (PlayerX < 0 && CurrentRoom.exits.left) ChangeRoom(CurrentRoom.exits.left, "right");

        // Keep the player inside the room
        PlayerX = Math.max(0, Math.min(PlayerX, CurrentRoom.width - PlayerW));
        PlayerY = Math.max(0, Math.min(PlayerY, RoomHeight() - PlayerH));

        // Update the ground state after moving, so the frame matches this step's position
        PlayerOnGround = (PlayerY >= OriginalY);

        // Pick the sprite frame (Draw() will use it) and move the camera
        CurrentFrame = ChooseFrame();
        UpdateCamera(false);
    }

    function Jump()
    {
        if (StartY - PlayerY < JumpHeight)
        {
            PlayerY -= JumpSpeed;
        }
        else
        {
            PlayerJump = false;
            FallStartY = PlayerY;
        }
    }

    function Gravity()
    {
        PlayerY += FallSpeed;
    }

    // ---------- Save data ----------
    const SaveKey = "cameraDemoSave";             // a different key from the real game, so saves don't mix

    let Save = {
        version: 1,
        room: "hall",
        x: 0                   // position as a fraction of the ROOM width (0 to 1)
    };

    function HasSave()
    {
        try { return localStorage.getItem(SaveKey) !== null; }
        catch (e) { return false; }
    }

    function SaveGame()
    {
        Save.x = PlayerX / CurrentRoom.width;

        try
        {
            localStorage.setItem(SaveKey, JSON.stringify(Save));
            SetMenuStatus("Game saved.");
            MenuHasSave = true;
            RefreshMenu();
        }
        catch (e)
        {
            SetMenuStatus("Could not save: browser storage is blocked.");
        }
    }

    function ApplySave()
    {
        ChangeRoom(Save.room);                    // first the room, so we know how wide it is

        let x = Number.isFinite(Save.x) ? Math.min(Math.max(Save.x, 0), 1) : 0;
        PlayerX = Math.min(x * CurrentRoom.width, CurrentRoom.width - PlayerW);
        PlayerY = OriginalY;                      // always put him back on the ground

        PlayerJump = false;
        JumpsUsed = 0;
        CrouchTimer = 0;
        JumpRequested = false;
        Spinning = false;

        UpdateCamera(true);
    }

    function LoadGame()
    {
        let text = null;
        try { text = localStorage.getItem(SaveKey); } catch (e) {}

        if (text === null)
        {
            SetMenuStatus("No saved game found.");
            return;
        }

        try { Object.assign(Save, JSON.parse(text)); }
        catch (e)
        {
            SetMenuStatus("The save is damaged.");
            return;
        }

        ApplySave();
        CloseMenu();
    }

    // ---------- Menu (HTML and CSS, in the #ui layer) ----------
    const MenuItems = ["Resume", "Save game", "Load game"];

    let DebugBox    = document.getElementById("Debug");
    let Menu        = document.getElementById("Menu");
    let MenuStatus  = document.getElementById("MenuStatus");
    let MenuButtons = [document.getElementById("BtnResume"), document.getElementById("BtnSave"), document.getElementById("BtnLoad")];
    let MiniLabel   = document.getElementById("MiniLabel");
    let MiniView    = document.getElementById("MiniView");
    let MiniPlayer  = document.getElementById("MiniPlayer");

    let Paused = false;
    let MenuSelected = 0;
    let MenuHasSave = false;

    function MenuEnabled(index) { return (index === 2) ? MenuHasSave : true; }
    function SetMenuStatus(text) { MenuStatus.textContent = text; }

    function RefreshMenu()
    {
        for (let i = 0; i < MenuButtons.length; i++)
        {
            MenuButtons[i].disabled = !MenuEnabled(i);
            MenuButtons[i].classList.toggle("selected", i === MenuSelected && MenuEnabled(i));
        }
    }

    function OpenMenu()
    {
        Paused = true;
        SetMenuStatus("");
        MenuHasSave = HasSave();
        MenuSelected = 0;
        Menu.style.display = "flex";
        RefreshMenu();
    }

    function CloseMenu()
    {
        Paused = false;
        JumpRequested = false;          // a space press made while paused must not cause a jump
        Menu.style.display = "none";
    }

    function MenuActivate(index)
    {
        if (index === 0) CloseMenu();
        else if (index === 1) SaveGame();
        else if (index === 2) LoadGame();
    }

    function MenuMove(step)
    {
        let i = MenuSelected;
        for (let n = 0; n < MenuItems.length; n++)
        {
            i = (i + step + MenuItems.length) % MenuItems.length;
            if (MenuEnabled(i)) { MenuSelected = i; break; }
        }
        RefreshMenu();
    }

    function MenuKey(event)
    {
        if (event.key === "ArrowDown") MenuMove(1);
        else if (event.key === "ArrowUp") MenuMove(-1);
        else if ((event.key === "Enter" || event.key === " ") && !event.repeat) MenuActivate(MenuSelected);
    }

    MenuButtons.forEach(function(button, index) {
        button.addEventListener("click", function() { MenuActivate(index); this.blur(); });
        button.addEventListener("mouseenter", function() {
            if (MenuEnabled(index)) { MenuSelected = index; RefreshMenu(); }
        });
    });

    // ---------- Drawing the game world (canvas) ----------
    // Far layer: stars. They barely move with the camera, so they look very far away.
    let Stars = [];
    (function() {
        let r = Rand(7);
        for (let i = 0; i < 160; i++) Stars.push({ u: r(), v: r(), size: 1.5 + r() * 2.5 });
    })();

    function DrawStars()
    {
        UseWorldSpace(0.2);
        ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
        let span = CurrentRoom.width * 0.2 + ViewW * 2;
        for (let s of Stars) ctx.fillRect(s.u * span - ViewW, s.v * (FloorY - 40), s.size, s.size);
    }

    // Middle layer: dark mountains. They move at half speed.
    function DrawMountains()
    {
        UseWorldSpace(0.5);
        ctx.fillStyle = "rgba(8, 4, 20, 0.55)";

        let left = CameraX * 0.5;
        let first = Math.floor((left - 340) / 260);
        let last  = Math.ceil((left + ViewW) / 260);

        for (let i = first; i <= last; i++)
        {
            let x = i * 260;
            let h = 120 + (((i * 73) % 140) + 140) % 140;
            ctx.beginPath();
            ctx.moveTo(x, FloorY);
            ctx.lineTo(x + 160, FloorY - h);
            ctx.lineTo(x + 320, FloorY);
            ctx.closePath();
            ctx.fill();
        }
    }

    // The floor, drawn across everything that is visible
    function DrawFloor()
    {
        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        ctx.fillRect(CameraX - 100, FloorY, ViewW + 200, DesignH * 2);
        ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
        ctx.fillRect(CameraX - 100, FloorY, ViewW + 200, 3);
    }

    // Everything beyond the room's edges is darkened, so you can see where the room ends
    function DrawOutsideRoom()
    {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";

        let leftEdge  = CameraX - 200;                // the part of the view to the left of the room
        let rightEdge = CameraX + ViewW + 200;        // and to the right of it
        if (leftEdge < 0) ctx.fillRect(leftEdge, -1000, -leftEdge, 3000);
        if (rightEdge > CurrentRoom.width) ctx.fillRect(CurrentRoom.width, -1000, rightEdge - CurrentRoom.width, 3000);

        // red edge lines
        ctx.fillStyle = "#ff4d4d";
        ctx.fillRect(-4, 0, 4, FloorY);
        ctx.fillRect(CurrentRoom.width, 0, 4, FloorY);
    }

    // A faint ruler: a line every 250 units with its world position written on it
    function DrawRuler()
    {
        ctx.font = "14px monospace";
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";

        let first = Math.floor(CameraX / 250) * 250;
        for (let x = first; x <= CameraX + ViewW; x += 250)
        {
            if (x < 0 || x > CurrentRoom.width) continue;
            let screenStart = (x % 1280 === 0);
            ctx.fillStyle = screenStart ? "rgba(201, 161, 91, 0.5)" : "rgba(255, 255, 255, 0.12)";
            ctx.fillRect(x, 0, screenStart ? 2 : 1, FloorY);
            ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
            ctx.fillText(String(x), x + 4, 120);          // low enough not to sit under the debug text
        }
    }

    function DrawProps()
    {
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";

        for (let p of CurrentRoom.props)
        {
            if (p.x < CameraX - 150 || p.x > CameraX + ViewW + 150) continue;     // off screen: skip

            if (p.box)
            {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, FloorY - p.h, p.w, p.h);
                ctx.fillStyle = "black";
                ctx.font = "bold 22px monospace";
                ctx.fillText(p.label, p.x + p.w / 2, FloorY - p.h + 30);
            }
            else
            {
                ctx.font = p.s + "px serif";
                ctx.fillStyle = "white";
                ctx.fillText(p.e, p.x, FloorY - (p.up || 0));
            }
        }
    }

    function DrawPlayer()
    {
        if (!SheetImg.complete || SheetImg.naturalWidth === 0) return;     // sheet not loaded yet

        let col = CurrentFrame % SheetCols;
        let row = Math.floor(CurrentFrame / SheetCols);

        ctx.save();
        if (LeftPlayer)
        {
            ctx.translate(PlayerX + PlayerW, PlayerY);
            ctx.scale(-1, 1);                    // mirror to face left
        }
        else
        {
            ctx.translate(PlayerX, PlayerY);
        }
        ctx.drawImage(SheetImg, col * FrameW, row * FrameH, FrameW, FrameH, 0, 0, PlayerW, PlayerH);
        ctx.restore();
    }

    // Everything in the game world is drawn through here, back to front
    function Draw()
    {
        // 1. Screen space: the background fills the whole window and never moves
        UseScreenSpace();
        ctx.fillStyle = BackgroundFill;
        ctx.fillRect(0, 0, WindowWidth, WindowHeight);

        // 2. Far layers, moving slower than the world (parallax)
        DrawStars();
        DrawMountains();

        // 3. The world itself, shifted by the camera
        UseWorldSpace(1);
        DrawFloor();
        DrawRuler();
        DrawProps();
        DrawPlayer();
        DrawOutsideRoom();

        UseScreenSpace();
    }

    // ---------- Updating the interface (HTML) ----------
    function UpdateUI()
    {
        let rw = CurrentRoom.width;

        DebugBox.style.display = ShowDebug ? "block" : "none";
        if (ShowDebug)
        {
            DebugBox.textContent =
                "room: " + CurrentRoom.name + "\n" +
                "player x: " + Math.round(PlayerX) + " / " + rw + "\n" +
                "camera x: " + Math.round(CameraX) + "   view: " + Math.round(ViewW) + " units wide\n" +
                "frame " + CurrentFrame + " (" + StateName + ")";
        }

        // Mini map: the gold box is the part of the room the camera shows
        let viewFrac = Math.min(1, ViewW / rw);
        let left = Math.max(0, Math.min(1 - viewFrac, CameraX / rw));
        MiniLabel.textContent = CurrentRoom.name + " - " + rw + " units wide";
        MiniView.style.left   = (left * 100) + "%";
        MiniView.style.width  = (viewFrac * 100) + "%";
        MiniPlayer.style.left = (PlayerX / rw * 100) + "%";
    }

    // ---------- Main loop ----------
    // The game logic always runs in steps of 1/60 second, however fast the screen refreshes.
    const StepMs = 1000 / 60;
    let LastTime = performance.now();
    let Leftover = 0;

    function GameLoop(now)
    {
        Leftover += Math.min(now - LastTime, 250);      // the cap stops a huge catch-up after the tab was hidden
        LastTime = now;

        while (Leftover >= StepMs)
        {
            if (!Paused) MovePlayer();                  // the game freezes while the menu is open
            Leftover -= StepMs;
        }

        Draw();
        UpdateUI();
        requestAnimationFrame(GameLoop);
    }

    // If a save exists, start with the menu open so it can be loaded
    if (HasSave())
    {
        OpenMenu();
        MenuSelected = 2;               // highlight "Load game"
        RefreshMenu();
        SetMenuStatus("Saved game found. Press Load to continue.");
    }

    ChangeRoom("hall");
    requestAnimationFrame(GameLoop);
</script>

</body>
</html>
